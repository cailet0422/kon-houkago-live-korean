plugins { id 'com.android.application' }

// Signing secrets live in keystore.properties (not in git):
//   storeFile=../konko.keystore  storePassword=...  keyAlias=...  keyPassword=...
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'kr.konko.patcher'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'kr.konko.patcher'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            if (ksProps['storeFile']) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    androidResources { noCompress 'patch' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
